<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson Notes</title>
  <meta name="description" content="Handwritten lesson notes with recording, timestamped for an AI summary later.">
  <meta name="theme-color" content="#1f2937">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- All lessons -->
  <section id="home" class="screen">
    <header class="bar">
      <h1>Lesson Notes</h1>
      <button id="new-lesson" class="primary">+ New lesson</button>
    </header>
    <main class="home-main">
      <p id="storage-note" class="note"></p>
      <ul id="lesson-list"></ul>
      <p id="empty" class="note" hidden>No lessons yet. Press <b>+ New lesson</b> to start one.</p>
    </main>
  </section>

  <!-- One lesson: notes and recording -->
  <section id="lesson" class="screen" hidden>
    <header class="bar toolbar">
      <button id="back" title="All lessons">← Lessons</button>
      <input id="title" aria-label="Lesson title" maxlength="80">
      <div class="group">
        <button id="rec-start" class="primary">● Start lesson</button>
        <button id="rec-pause" hidden>Pause</button>
        <button id="rec-end" hidden>End lesson</button>
        <span id="clock" title="Lesson time (the recording's time)">0:00</span>
        <span id="rec-status"></span>
      </div>
      <div class="group" id="tools">
        <button data-tool="pen" class="active" title="Pen (P)">Pen</button>
        <button data-tool="highlighter" title="Highlighter (H)">Highlight</button>
        <button data-tool="eraser" title="Eraser: removes whole strokes (E)">Eraser</button>
      </div>
      <div class="group" id="colors">
        <button data-color="black" class="swatch active" title="Black" style="--c:#111827"></button>
        <button data-color="blue" class="swatch" title="Blue" style="--c:#1d4ed8"></button>
        <button data-color="red" class="swatch" title="Red" style="--c:#dc2626"></button>
        <button data-color="green" class="swatch" title="Green" style="--c:#15803d"></button>
      </div>
      <div class="group" id="sizes">
        <button data-size="2" title="Thin">S</button>
        <button data-size="4" class="active" title="Medium">M</button>
        <button data-size="8" title="Thick">L</button>
      </div>
      <div class="group">
        <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
      </div>
      <button id="export" title="Save this lesson as a .zip file for the AI summary">Export</button>
    </header>
    <main id="stage"><canvas id="canvas"></canvas></main>
    <footer class="bar pagebar">
      <button id="prev-page" title="Previous page (←)">◀</button>
      <span id="page-label">Page 1 / 1</span>
      <button id="next-page" title="Next page (→)">▶</button>
      <button id="add-page">+ New page</button>
    </footer>
  </section>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
